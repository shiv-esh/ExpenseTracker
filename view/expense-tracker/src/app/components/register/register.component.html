<div class="dashboard-wrapper">
    <nav class="nav">
        <span class="nav-brand">Expense<span class="accent">Tracker</span></span>
    </nav>
    <div class="content" style="display: flex; justify-content: center; align-items: center; min-height: calc(100vh - 65px);">
        <div class="card" style="width: 100%; max-width: 400px; padding: var(--space-6);">
            <div class="card-title" style="margin-bottom: var(--space-2); text-align: center; font-size: 32px;">Join Us</div>
            <p style="text-align: center; color: var(--color-neutral-600); margin-bottom: var(--space-6);">Create an account to start tracking</p>
    
            <form (ngSubmit)="register()" #registerForm="ngForm" style="display: flex; flex-direction: column; gap: var(--space-4);">
                <div class="field">
                    <label>Username</label>
                    <input type="text" class="input" name="username" [(ngModel)]="user.username" required placeholder="Pick a username">
                </div>
    
                <div class="field">
                    <label>Password</label>
                    <input type="password" class="input" name="password" [(ngModel)]="user.password" required placeholder="Create a password">
                </div>
    
                <p style="color: var(--color-accent); font-size: 13px; text-align: center; margin: 0;" *ngIf="errorMessage">{{ errorMessage }}</p>
    
                <button type="submit" class="btn btn-primary btn-block" style="padding: 12px;" [disabled]="!registerForm.form.valid">Create Account</button>
            </form>
    
            <div class="card-meta" style="justify-content: center; margin-top: var(--space-6); font-size: 14px;">
                <span>Already have an account? <a routerLink="/login">Sign In</a></span>
            </div>
        </div>
    </div>
</div>
